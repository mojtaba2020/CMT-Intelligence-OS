name: Import CMT Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and commit source
        shell: bash
        run: |
          set -e
          zipfile=$(find . -maxdepth 1 -type f -name 'CMT_Intelligence_OS_GitHub_Light_Source*.zip' -print -quit)
          test -n "$zipfile"
          unzip -t "$zipfile"
          unzip -o "$zipfile" -d . -x '.github/workflows/tests.yml'
          rm "$zipfile"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import CMT source"
          git push
