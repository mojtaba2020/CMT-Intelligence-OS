
name: Install CMT iPhone App

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cmt-iphone-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CMT release
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="CMT_IPHONE_GITHUB_FRESH_20261026.zip"

          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null

          python - <<'PYTHON'
          from zipfile import ZipFile
          from pathlib import PurePosixPath, Path
          import stat

          archive = Path(
              "CMT_IPHONE_GITHUB_FRESH_20261026.zip"
          )

          with ZipFile(archive) as z:
              for entry in z.infolist():
                  p = PurePosixPath(entry.filename)

                  if (
                      p.is_absolute()
                      or ".." in p.parts
                      or entry.is_dir()
                  ):
                      raise ValueError(
                          "Unsafe archive path: "
                          + entry.filename
                      )

                  if p.parts[0] in (".git", ".github"):
                      raise ValueError(
                          "Protected repository path"
                      )

                  if stat.S_IFMT(
                      entry.external_attr >> 16
                  ) == stat.S_IFLNK:
                      raise ValueError(
                          "Symlinks not supported"
                      )

                  if entry.file_size > 1500000:
                      raise ValueError("File too large")

                  target = Path(*p.parts)
                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )
                  target.write_bytes(z.read(entry))

          archive.unlink()
          Path("docs/.nojekyll").touch()
          PYTHON

          test -f docs/index.html
          test -f docs/app.js
          test -f docs/core.js
          test -f docs/sw.js
          test -f docs/manifest.webmanifest

          node --check docs/app.js
          node --check docs/core.js
          node --check docs/ocr_adapter.js
          node --check docs/sw.js

          python -m json.tool \
            docs/manifest.webmanifest > /dev/null

      - name: Install OCR and table dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements-dev.txt \
            -r requirements-table.txt

          tesseract --version

          python -c "import cv2; print(cv2.__version__)"

      - name: Run software tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q -k 'not browser'

      - name: Commit updated project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Release CMT iPhone v2.0"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload iPhone application
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish iPhone application
        id: deployment
        uses: actions/deploy-pages@v4
